<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#3869f5"><meta name="description" content="轻填志愿报名助手：一次整理资料，轻松预填表单、管理报名任务。">
  <title>轻填 · 志愿报名助手</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%233869f5'/%3E%3Cpath d='M17 33l10 10 21-24' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css"><script src="engine.js" defer></script><script src="app.js" defer></script>
</head>
<body>
<svg class="svg-library" aria-hidden="true"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 13 4-4M8 15l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 2 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 1)"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-7z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4M12 17h.01"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></symbol>
</defs></svg>
<aside class="sidebar">
 <a class="brand" href="#dashboard"><span class="brand-logo"><svg class="icon"><use href="#i-check"/></svg></span><span>轻填<span class="brand-en">QUICKFILL</span></span></a>
 <div class="workspace-label">我的报名空间 <span>个人版</span></div>
 <nav aria-label="主要导航">
  <button data-view="dashboard" class="nav-item active"><svg class="icon"><use href="#i-grid"/></svg><span>报名工作台</span><span class="nav-dot"></span></button>
  <button data-view="profile" class="nav-item"><svg class="icon"><use href="#i-user"/></svg><span>我的资料</span></button>
  <button data-view="templates" class="nav-item"><svg class="icon"><use href="#i-file"/></svg><span>填写模板</span></button>
  <button data-view="history" class="nav-item"><svg class="icon"><use href="#i-clock"/></svg><span>操作记录</span></button>
 </nav>
 <div class="sidebar-bottom"><div class="extension-card"><span class="mini-label">让报名更顺手</span><h3>连接浏览器助手</h3><p>在电脑上预填表单，<br>到点执行报名任务。</p><button class="btn extension-install" data-action="help">设置助手 <svg class="icon"><use href="#i-arrow"/></svg></button></div><button class="nav-item" data-view="help"><svg class="icon"><use href="#i-help"/></svg><span>使用指南</span></button><div class="local-note"><span class="dot"></span>资料保存在当前浏览器</div></div>
</aside>
<div class="app-shell">
 <header class="topbar"><div class="breadcrumb">我的空间 <span>/</span> <strong id="page-crumb">报名工作台</strong></div><div class="header-right"><span id="today"></span><button id="connection-pill" class="connection-pill" data-action="help"><span class="dot"></span><span>助手未连接</span></button><button class="avatar" data-action="profile" aria-label="编辑我的资料">我</button></div></header>
 <main id="main" tabindex="-1"></main>
 <footer>轻填 · 少一点重复，多一点从容 <span>所有时间均为北京时间 UTC+8</span></footer>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
</body></html>
