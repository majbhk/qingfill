<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻填 · 腾讯表单结构演示</title><link rel="stylesheet" href="styles.css"><script src="engine.js" defer></script><script src="tencent-demo.js" defer></script><style>body{padding:28px 16px}main{max-width:850px;padding:0;min-height:0}.question-main-content{border:1px solid #e6ebf3;background:white;border-radius:12px;padding:18px 22px;margin:14px 0}.question-title{font-size:14px;font-weight:600;margin-bottom:12px}.question-title:before{content:'* ';color:#e17676}.question-content textarea{display:block;width:100%;min-height:43px;border:1px solid #dfe5ed;border-radius:6px;padding:10px;font:inherit;resize:vertical}.question-content textarea:disabled{background:#f4f6f9}.form-choice-option{padding:8px 10px;margin:4px 0;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13px}.form-choice-option:before{content:'';width:14px;height:14px;border:1px solid #bbc7db;border-radius:50%;flex-shrink:0}.form-choice-option[aria-checked=true]{background:#edf3ff;color:#3869f5}.form-choice-option[aria-checked=true]:before{border:4px solid #3869f5}.readonly{opacity:.65}.readonly .form-choice-option{cursor:not-allowed}.demo-controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.demo-controls select{padding:9px;border:1px solid #dfe5ed;border-radius:8px;background:white}.result{padding:16px 20px;background:#edf3ff;border-radius:10px;font-size:13px;white-space:pre-wrap;color:#4b669e;margin:18px 0}.intro{font-size:12px;color:#8292ad}.demo-title{font-size:25px;line-height:1.4;margin:16px 0 9px}#platform-state{color:#be8051;font-size:12px}#receipt{font-size:13px;color:#269c78}</style></head><body><main><a href="./#help">← 返回使用指南</a><h1 class="demo-title">腾讯收集表结构演示</h1><p class="intro">依据参考表观察到的题目结构构建。使用虚构资料，仅在本站运行，不连接或提交到腾讯文档。</p><div class="demo-controls"><label>模拟状态 <select id="scenario"><option value="open">开放模拟</option><option value="full">容量测试</option><option value="login">登录测试</option><option value="early">时间测试</option></select></label><button class="btn" id="inspect">只检查结构</button><button class="btn primary" id="fill">一键预填示例</button><button class="btn" id="autosubmit">演示自动提交一次</button></div><div id="result" class="result" role="status">先检查结构，再体验一键预填。年级会精确匹配“2026级（专升本）”。</div><p id="platform-state"></p><section id="questions" aria-label="模拟收集表"></section><button class="btn primary" id="demo-submit">提交</button><p id="receipt" role="status"></p></main></body></html>
